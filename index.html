<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Orchard — Apple-style commerce QA playground</title>
  <style>
    :root{--ink:#171717;--muted:#6e6e73;--line:#d2d2d7;--soft:#f5f5f7;--blue:#06c;--green:#1d8348;--red:#d70015}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#fff}
    button,input,select{font:inherit}button{cursor:pointer}.nav{height:52px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;gap:28px;padding:0 max(22px,calc((100% - 1120px)/2));position:sticky;top:0;z-index:5}
    .mark{font-weight:700;font-size:20px}.nav a{color:#333;text-decoration:none}.nav .spacer{flex:1}.pill{border:0;background:none;font-size:20px}.hero{text-align:center;background:var(--soft);padding:58px 20px 48px}.eyebrow{color:var(--blue);font-weight:600}.hero h1{font-size:clamp(38px,6vw,68px);line-height:1.02;margin:8px 0}.hero p{color:var(--muted);font-size:20px;margin:12px auto 24px}.hero button,.primary{background:#0071e3;border:0;color:#fff;border-radius:22px;padding:11px 20px;font-weight:600}.wrap{max-width:1120px;margin:auto;padding:34px 22px 80px}.tools{display:flex;align-items:center;gap:10px;margin-bottom:24px}.tools h2{margin-right:auto}.tools input{width:240px;border:1px solid var(--line);border-radius:20px;padding:10px 15px}.filter{border:1px solid var(--line);background:#fff;border-radius:20px;padding:9px 15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{border:1px solid #e5e5e5;border-radius:16px;overflow:hidden;background:#fff;transition:.15s}.card:hover{box-shadow:0 5px 18px #0002;transform:translateY(-2px)}.visual{height:190px;background:var(--soft);display:grid;place-items:center;font-size:75px}.cardbody{padding:16px}.card h3{margin:0 0 4px}.muted{color:var(--muted)}.price{font-weight:600;margin:12px 0}.card .primary{width:100%;border-radius:9px}.stock{color:var(--green);font-size:13px}.low{color:#b05b00}.modal{position:fixed;inset:0;background:#0008;z-index:10;display:grid;place-items:center;padding:20px}.modal.hidden{display:none}.sheet{background:#fff;border-radius:20px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:28px}.close{float:right;border:0;background:var(--soft);border-radius:50%;width:34px;height:34px;font-size:20px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:26px}.bigvisual{background:var(--soft);border-radius:16px;min-height:320px;display:grid;place-items:center;font-size:130px}.options{border-top:1px solid var(--line);margin-top:20px;padding-top:18px}.options label,.checkout label{display:block;font-weight:600;font-size:13px;margin:11px 0 5px}.options select,.options input,.checkout input{width:100%;padding:11px;border:1px solid #999;border-radius:8px}.qty{display:flex;gap:10px;align-items:center}.qty input{width:100px}.alert{padding:12px;border-radius:9px;background:#fff1f1;color:var(--red);margin:14px 0}.cartline{display:flex;align-items:center;gap:15px;border-bottom:1px solid var(--line);padding:16px 0}.cartline .emoji{font-size:38px}.cartline .grow{flex:1}.checkout{max-width:550px}.checkout h2{margin-top:0}.checkout .primary{width:100%;margin-top:18px;border-radius:9px}.success{text-align:center;padding:35px}.success b{font-size:28px;color:var(--green)}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.nav a{display:none}}@media(max-width:520px){.grid,.detail{grid-template-columns:1fr}.tools{flex-wrap:wrap}.tools h2{width:100%}.tools input{width:100%}}
  </style>
</head>
<body>
  <header class="nav"><span class="mark">● orchard</span><a href="#store" id="storeLink" data-ai-id="store-link">Store</a><a href="#support" id="supportLink" data-ai-id="support-link">Support</a><a href="#account" id="accountLink" data-ai-id="account-link">Account</a><span class="spacer"></span><button class="pill" id="cartButton" data-ai-id="cart-button" aria-label="Shopping bag">🛍️ <small id="cartCount">0</small></button></header>
  <section class="hero"><div class="eyebrow">New</div><h1>Meet your next favorite.</h1><p>Beautiful devices. Thoughtfully tested.</p><button id="heroShop" data-ai-id="hero-shop">Shop all products</button></section>
  <main class="wrap" id="store"><div class="tools"><h2>Featured products</h2><input id="searchInput" data-ai-id="search-input" placeholder="Search products" aria-label="Search products"><button class="filter" id="categoryButton" data-ai-id="category-filter">Filter</button><button class="filter" id="sortButton" data-ai-id="sort-products">Sort</button></div><div id="products" class="grid"></div></main>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="sheet"><button class="close" id="closeModal" aria-label="Close">×</button><div id="modalContent"></div></div></div>
  <script>
    const products=[
      {id:"phone-pro",name:"Orchard Phone Pro",desc:"Titanium. A18 chip. Pro camera system.",price:99900,emoji:"📱",cat:"Phone",stock:3,colors:["Natural","Black","Silver"]},
      {id:"phone-air",name:"Orchard Phone Air",desc:"Light, fast, and ready for anything.",price:69900,emoji:"📱",cat:"Phone",stock:12,colors:["Blue","Starlight"]},
      {id:"pad-max",name:"Orchard Pad Max",desc:"A canvas for your biggest ideas.",price:89900,emoji:"▣",cat:"Tablet",stock:5,colors:["Space Gray","Silver"]},
      {id:"book-pro",name:"Orchard Book Pro",desc:"Power for professionals, all day.",price:149900,emoji:"💻",cat:"Mac",stock:2,colors:["Space Black","Silver"]},
      {id:"watch-ultra",name:"Orchard Watch Ultra",desc:"Adventure starts with a better view.",price:79900,emoji:"⌚",cat:"Watch",stock:8,colors:["Natural Titanium"]},
      {id:"buds-max",name:"Orchard Buds Max",desc:"Immersive sound. Adaptive audio.",price:54900,emoji:"🎧",cat:"Audio",stock:20,colors:["Midnight","White"]},
      {id:"desk-display",name:"Orchard Display",desc:"A brilliant 5K workspace.",price:129900,emoji:"🖥️",cat:"Mac",stock:1,colors:["Silver"]},
      {id:"phone-case",name:"FineWoven Case",desc:"Protective, soft, and remarkably slim.",price:5900,emoji:"▰",cat:"Accessories",stock:50,colors:["Black","Blue","Taupe"]}
    ];
    let cart=[], activeProduct=null, promoApplied=false, selectedCategory="All", sortMode="featured", checkoutInFlight=false, cartVersion=0;
    const $=id=>document.getElementById(id), money=n=>"₹"+Math.round(Number.isFinite(n)?n:0).toLocaleString("en-IN");
    const cartTotal=()=>cart.reduce((n,x)=>{let p=products.find(p=>p.id===x.id);return n+(p&&Number.isSafeInteger(x.qty)&&x.qty>0?p.price*x.qty:0)},0);
    function persistCart(){try{localStorage.setItem("orchard-cart",JSON.stringify({version:++cartVersion,cart}))}catch{}}
    function renderProducts(){let q=$("searchInput").value.trim().toLowerCase();let list=products.filter(p=>(selectedCategory==="All"||p.cat===selectedCategory)&&(!q||[p.name,p.desc,p.cat].join(" ").toLowerCase().includes(q)));if(sortMode==="low")list.sort((a,b)=>a.price-b.price);if(sortMode==="high")list.sort((a,b)=>b.price-a.price);$("products").innerHTML=list.map(p=>`<article class="card" data-id="${p.id}" data-testid="product-${p.id}"><div class="visual">${p.emoji}</div><div class="cardbody"><h3>${p.name}</h3><div class="muted">${p.desc}</div><div class="price">${money(p.price)}</div><div class="${p.stock<3?"stock low":"stock"}">${p.stock<3?"Only "+p.stock+" left":"In stock"}</div><button class="primary add" data-product="${p.id}" data-ai-id="view-${p.id}">View product</button></div></article>`).join("")||"<p>No products found. Try clearing your filters.</p>";document.querySelectorAll(".card").forEach(c=>c.onclick=e=>{if(!e.target.closest(".add"))openProduct(c.dataset.id)});document.querySelectorAll(".add").forEach(b=>b.onclick=()=>openProduct(b.dataset.product))}
    function openProduct(id){activeProduct=products.find(p=>p.id===id);$("modalContent").innerHTML=`<div class="detail"><div class="bigvisual">${activeProduct.emoji}</div><div><div class="eyebrow">${activeProduct.cat}</div><h1>${activeProduct.name}</h1><p class="muted">${activeProduct.desc}</p><h2>${money(activeProduct.price)}</h2><div class="stock">${activeProduct.stock} available</div><div class="options"><label for="color">Finish</label><select id="color" data-ai-id="finish-select">${activeProduct.colors.map(c=>`<option value="${c}">${c}</option>`).join("")}</select><label for="quantity">Quantity</label><div class="qty"><input id="quantity" data-ai-id="quantity-input" type="number" min="1" max="10" value="1"><span class="muted">Maximum 10 per order</span></div><div id="productAlert" role="alert"></div><button class="primary" id="addToBag" data-ai-id="add-to-bag">Add to bag</button></div></div></div>`;$("addToBag").onclick=addToCart;show()}
    function addToCart(){let qty=Number($("quantity").value);if(!Number.isSafeInteger(qty)||qty<1||qty>10){$("productAlert").innerHTML='<div class="alert">Choose a safe whole-number quantity from 1 to 10.</div>';return}if(qty>activeProduct.stock){$("productAlert").innerHTML='<div class="alert">That quantity is unavailable. Only '+activeProduct.stock+' remain.</div>';return}let found=cart.find(x=>x.id===activeProduct.id);if(found){if(found.qty+qty>activeProduct.stock){$("productAlert").innerHTML='<div class="alert">Your bag exceeds current inventory. Reduce the quantity.</div>';return}found.qty+=qty}else cart.push({id:activeProduct.id,qty,finish:$("color").value});updateCart();hide()}
    function updateCart(){let count=cart.reduce((n,x)=>n+(Number.isSafeInteger(x.qty)&&x.qty>0?x.qty:0),0);$("cartCount").textContent=count;persistCart()}
    function show(){ $("modal").classList.remove("hidden") } function hide(){ $("modal").classList.add("hidden") }
    function openCart(){let subtotal=cartTotal(),total=promoApplied?subtotal*.9:subtotal;$("modalContent").innerHTML=`<h1>Your bag</h1>${cart.length?cart.map(x=>{let p=products.find(p=>p.id===x.id);return p?`<div class="cartline"><span class="emoji">${p.emoji}</span><div class="grow"><b>${p.name}</b><div class="muted">${x.finish} · ${x.qty}</div></div><strong>${money(p.price*x.qty)}</strong><button class="filter remove" data-id="${p.id}">Remove</button></div>`:""}).join("")+`<h2>${promoApplied?"Discounted ":""}Total ${money(total)}</h2><button class="primary" id="checkoutButton">Checkout</button><div class="options"><input id="promo" data-ai-id="promo-input" maxlength="32" placeholder="Promo code"><button class="filter" id="applyPromo" data-ai-id="apply-promo">Apply</button><div id="promoMessage" class="muted"></div></div>`:'<p class="muted">Your bag is empty.</p>'}`;document.querySelectorAll(".remove").forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x.id!==b.dataset.id);if(!cart.length)promoApplied=false;updateCart();openCart()});$("checkoutButton")?.addEventListener("click",checkout);$("applyPromo")?.addEventListener("click",applyPromo);show()}
    function applyPromo(){let raw=$("promo").value.trim();let code=raw.toUpperCase();let unsafe=raw.length>32||/[<>{}()[\];'"]/u.test(raw);$("promoMessage").textContent=unsafe?"Promo code rejected as malformed input.":code==="ORCHARD10"?"Promo applied: 10% off":code?"That promo code isn't valid.":"Enter a promo code.";$("promoMessage").style.color=code==="ORCHARD10"?"var(--green)":"var(--red)";promoApplied=!unsafe&&code==="ORCHARD10"}
    function checkout(){if(!cart.length)return; $("modalContent").innerHTML=`<div class="checkout"><h2>Checkout</h2><p class="muted">Secure demo checkout — no real payment is processed.</p><label for="name">Full name</label><input id="name" data-ai-id="customer-name" placeholder="Alex Morgan"><label for="email">Email</label><input id="email" data-ai-id="customer-email" type="email" placeholder="alex@example.com"><label for="card">Card number</label><input id="card" data-ai-id="card-number" inputmode="numeric" maxlength="19" placeholder="4242 4242 4242 4242"><label for="expiry">Expiry and CVV</label><input id="expiry" data-ai-id="expiry-cvv" placeholder="12/30 · 123"><div id="checkoutError" role="alert"></div><button class="primary" id="payButton" data-ai-id="place-order">Place order</button></div>`;$("payButton").onclick=pay}
    function pay(){if(checkoutInFlight)return;let ids=["name","email","card","expiry"];if(ids.some(id=>!$(id).value.trim())){$("checkoutError").innerHTML='<div class="alert">Please complete all required fields.</div>';return}let email=$("email").value.trim(),card=$("card").value.replace(/\s/g,"");if(!/^[^@]+@[^@]+\\.[^@]+$/.test(email)){$("checkoutError").innerHTML='<div class="alert">Enter a valid email address.</div>';return}if(!/^\\d{12,19}$/.test(card)){$("checkoutError").innerHTML='<div class="alert">Enter a valid card number.</div>';return}let unavailable=cart.find(x=>{let p=products.find(p=>p.id===x.id);return !p||x.qty>p.stock});if(unavailable){$("checkoutError").innerHTML='<div class="alert">Inventory changed in another session. Review your bag before paying.</div>';return}checkoutInFlight=true;$("payButton").disabled=true;$("payButton").textContent="Processing…";setTimeout(()=>{cart.forEach(x=>{let p=products.find(p=>p.id===x.id);if(p)p.stock-=x.qty});$("modalContent").innerHTML='<div class="success"><b>✓</b><h1>Order confirmed</h1><p>Your Orchard order is on its way.</p><p class="muted">Confirmation sent to '+email+'</p><button class="primary" id="done">Done</button></div>';$("done").onclick=()=>{cart=[];promoApplied=false;checkoutInFlight=false;updateCart();hide()}},650)}
    try{let saved=JSON.parse(localStorage.getItem("orchard-cart")||"null");if(Array.isArray(saved?.cart))cart=saved.cart.filter(x=>products.some(p=>p.id===x.id)&&Number.isSafeInteger(x.qty)&&x.qty>0)}catch{}
    window.addEventListener("storage",e=>{if(e.key!=="orchard-cart"||!e.newValue)return;try{let next=JSON.parse(e.newValue);if(next.version>cartVersion&&Array.isArray(next.cart)){cart=next.cart;cartVersion=next.version;promoApplied=false;$("cartCount").textContent=cart.reduce((n,x)=>n+(Number.isSafeInteger(x.qty)&&x.qty>0?x.qty:0),0);if(!$("modal").classList.contains("hidden"))openCart()}}catch{}});
    $("searchInput").oninput=renderProducts;$("cartButton").onclick=openCart;$("closeModal").onclick=hide;$("heroShop").onclick=()=>$("store").scrollIntoView({behavior:"smooth"});$("categoryButton").onclick=()=>{let cats=["All",...new Set(products.map(p=>p.cat))];selectedCategory=cats[(cats.indexOf(selectedCategory)+1)%cats.length];$("categoryButton").textContent=`Filter: ${selectedCategory}`;renderProducts()};$("sortButton").onclick=()=>{sortMode=sortMode==="featured"?"low":sortMode==="low"?"high":"featured";$("sortButton").textContent=`Sort: ${sortMode}`;renderProducts()};$("modal").onclick=e=>{if(e.target===$("modal"))hide()};updateCart();renderProducts();
  </script>
</body>
</html>
